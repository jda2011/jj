<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 비밀 다이어리</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📖 My Personal Diary</h1>
      <p>오늘의 순간을 남겨보세요</p>
    </header>

    <!-- form 태그로 감싸고 submit 이벤트를 차단하도록 제어합니다 -->
    <form class="diary-form" id="diaryForm">
      <div class="input-row">
        <input type="date" id="diaryDate" required>
        <select id="diaryMood">
          <option value="😊">😊 기쁨</option>
          <option value="🌿">🌿 평온</option>
          <option value="🔥">🔥 열정</option>
          <option value="☁️">☁️ 우울</option>
          <option value="😢">😢 슬픔</option>
        </select>
      </div>

      <input type="text" id="diaryTitle" placeholder="제목을 입력하세요..." maxlength="50" required>
      <textarea id="diaryContent" placeholder="오늘 하루는 어땠나요? 자유롭게 기록해 보세요." required></textarea>
      <button type="submit" id="saveBtn">일기 저장하기</button>
    </form>

    <section class="diary-list" id="diaryList">
      <!-- 작성된 일기가 들어갈 공간 -->
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
